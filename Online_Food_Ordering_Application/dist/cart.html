<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="output.css">
    <title>Cart</title>
</head>
<body class="relative flex justify-center items-center flex-col bg-amber-200">

    <div class="absolute top-10 left-0 ml-15 text-xl">
        <a href="index.html" class="flex items-center gap-3 font-bold"><i class="fa-regular fa-house"></i>Home</a>
        <button id="clear-cart" class="font-bold rounded-xl shadow-[0px_0px_10px_rgba(0,0,0,1)]" onmouseover="this.style.background='#ee6055'; this.style.color = 'white';" onmouseout="this.style.background='#ff3b20'; this.style.color = 'black'" style="font-size: medium; margin-top: 30px; padding: 8px 12px; background: #ff3a20;">Clear Cart</button>
    </div>

    <div>
        <p id="total-Product" class="text-4xl font-bold p-4" style="margin-bottom: 20px;">Number of Product in the cart: <span>0</span></p>
    </div>

    <div id="cart-page" class="w-180 flex items-center justify-center bg-white rounded-3xl">
        <div id="card-container"  class="flex justify-center items-center flex-col"> 
            <div id="card-1"
            class="relative grid grid-rows-7 rounded-3xl overflow-hidden mb-3 mt-3 w-80 h-65 bg-amber-200 hover:bg-amber-100  hover:ring hover:shadow-[0px_0px_20px_rgba(0,0,0,1)]  hover:scale-105 transition-transform duration-300 font-bold">
            <img class="row-span-6 w-full h-full object-cover"
                src=""
                alt="">
            <div class="flex justify-center items-center gap-2">
                <p id="p-name" class="row-span-1 text-center">This is a pic</p>
                <p id="p-price" class="font-bold text-xl">100</p>
                
            </div>
            <button id="remove-item" class="absolute bottom-12 right-3 hover:text-red-600 text-3xl"><i class="fa-solid fa-minus"></i></button>
        </div>
    </div>
                
    </div>

    <div class="flex justify-center items-center flex-col gap-4" style="margin-top: 25px;">
        <p id="total-price" class="font-bold text-4xl p-4 mt-3">Total price: <span>0</span></p>
        <button id="payment" style="padding: 10px 30px; margin-top: 40px;" class="p-4 bg-green-600 rounded-lg text-xl font-bold mt-3 hover:bg-green-400 shadow-[0px_0px_10px_rgba(0,0,0,1)] hover:text-white">Pay Now</button>
    </div>

    <script src="cart.js"></script>
</body>
</html>
