<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Favorite Foods</title>
</head>
<body class="relative flex justify-center items-center flex-col" style="background: url('./images/cream-paper.png'); background-color: #003566;">

    <!--------------------------- Popup for the events ----------------------------------->
    <div id="popup" class="fixed bg-green-400 text-xl top-18 left-170 w-fit h-fit py-3 px-4 rounded-xl opacity-0 transition-opacity duration-500 z-10 shadow-[0px_0px_6px_rgba(0,0,0,1)]">This is the popup!</div>

    <div class="absolute top-10 left-0 ml-15 text-xl">
        <a onclick="clickButtonSound('index.html')" class="flex items-center gap-3 font-bold hover:cursor-pointer"><i class="fa-regular fa-house"></i>Home</a>
        <button id="clear-favorites" class="font-bold rounded-xl shadow-[0px_0px_4px_rgba(0,0,0,1)] bg-[#ff3b20] hover:bg-[#ee6055] hover:text-white mt-7.5 px-3 py-2" style="font-size: medium;"
        onclick="removeFromFavoriteSound('Your favorite page is clear!')">Clear Favorites</button>
    </div>

    <div>
        <p class="text-5xl font-bold p-4 mb-5.5 text-shadow-black text-shadow-[0px_0px_3px_rgba(0,0,0,1)]">Your Favorites</p>
        <p id="total-Product" class="text-4xl font-bold p-4 mb-5.5">Number of items: <span>0</span></p>
    </div>

    <div id="cart-page" class="w-180 flex items-center justify-center bg-white rounded-3xl mb-10">
        <div id="card-container"  class="flex justify-center items-center flex-col"> 
            <div id="card-1"
            class="relative grid grid-rows-7 rounded-3xl overflow-hidden mb-3 mt-3 w-80 h-65 bg-amber-200 hover:bg-amber-100  hover:ring hover:shadow-[0px_0px_20px_rgba(0,0,0,1)]  hover:scale-105 transition-transform duration-300 font-bold">
            <img class="row-span-6 w-full h-full object-cover"
                src=""
                alt="">
            <div class="flex justify-center items-center gap-2 text-[#112A43]">
                <p id="p-name" class="row-span-1 text-center">This is a pic</p>
                <p id="p-price" class="font-bold text-xl">100</p>
            </div>
             <button id="remove-item" class="absolute bottom-12 right-3 text-red-600 text-3xl" onclick="removeFromFavoriteSound('Removed from favorites!')"><i class="fa-solid fa-heart"></i></button>   
    </div>


    <script>
        
        const favoriteFoods = JSON.parse(localStorage.getItem('favoriteFoods')) || [];
        console.log(favoriteFoods)
        const container = document.querySelector('#card-container');
        const template = document.querySelector('#card-1').cloneNode(true);
         if(favoriteFoods.length === 0){
            container.innerHTML = '<p class="p-4 text-gray-500">No favorite items yet.</p>';
        } else{
            container.innerHTML = '';
        }

        favoriteFoods.forEach((product) => {
            const card = template.cloneNode(true);
            card.querySelector('img').src = product.imageUrl;
            card.querySelector('#p-name').textContent = product.itemName;
            card.querySelector('#p-price').innerHTML = `<i class="fa-solid fa-indian-rupee-sign"></i> ${product.itemPrice}`;
           totalProduct();
           
           
            const removeItem = card.querySelector('#remove-item');
            removeItem.addEventListener('click', () => {
            const updatedCart = favoriteFoods.filter(item => item !== product);
    
            // update the cart array in place
            favoriteFoods.length = 0;
            console.log(favoriteFoods.length);
            updatedCart.forEach(item => favoriteFoods.push(item));
            localStorage.setItem('favoriteFoods', JSON.stringify(favoriteFoods));
            card.remove();
            totalProduct();

            if(favoriteFoods.length === 0){
            container.innerHTML = '<p class="p-4 text-gray-500">No favorite items yet.</p>';
            }
            });

            function totalProduct() {
                const numOfProduct = favoriteFoods.length;
                console.log(favoriteFoods.length)
                document.querySelector('#total-Product span').textContent = numOfProduct;
            }
           
           
            container.appendChild(card);
        });

        document.querySelector('#clear-favorites').addEventListener('click', () => {

            favoriteFoods.length = 0;
            localStorage.removeItem('favoriteFoods');
            document.querySelector('#total-Product span').textContent = 0;
            document.querySelector('#card-container').innerHTML = '<p class="p-4 text-gray-500">No favorite items yet.</p>';
        })


        // click button
        const clickSound = new Audio('./sound_effects/click2.mp3');
        // clickSound.preload = 'none';

        function clickButtonSound(pageLink){
        clickSound.currentTime = 0;
        clickSound.play();
        setTimeout(() => {
            window.location.href = pageLink;
        }, 500);
        }

        // function commonButtonSound(){
        // clickSound.currentTime = 0;
        // clickSound.play();
        // }

        function removeFromFavoriteSound(message){
            const removeSound = new Audio('./sound_effects/delete1.mp3');
            if(favoriteFoods.length !== 0) {
                removeSound.currentTime = 0;
                removeSound.play();
                showPopup(message, 3000);
            }
        }


        // ===================================== popup =========================== // 
        function showPopup(message, duration = 3000) {
            const popup = document.querySelector('#popup');
            popup.textContent = message;
            popup.classList.remove('opacity-0');
            popup.classList.add('opacity-100');

            setTimeout(() => {
                popup.classList.remove('opacity-100');
                popup.classList.add('opacity-0');
            }, duration);
        }

    </script>
</body>
</html>
