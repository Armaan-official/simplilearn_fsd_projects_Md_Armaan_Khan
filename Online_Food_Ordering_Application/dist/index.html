<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Document</title>
</head>
<body class="overflow-y-hidden relative">

    <!----------------------------------------- Sidebar ---------------------------------------------->
    <button id="menu" class="px-6 pt-6 absolute text-lg -mt-2 "><i class="fa-solid fa-bars"></i></button> 
    <nav  id="sidebar" class="absolute h-screen w-1/4 bg-amber-300 transform -translate-x-full transition-transform duration-500">
        <h1 id="app-heading" class="p-6 text-3xl font-bold">Food App</h1>
        <button id="back-arrow" class="px-6 pt-6"><i class="fa-solid fa-arrow-left"></i></button> 
        <div class="flex flex-col justify-between p-6 h-4/7 text-lg"> 
           <a href="" class="flex items-center gap-3"><i class="fa-regular fa-house"></i>Home</a>
           <a href="" class="flex items-center gap-3"><i class="fa-solid fa-bowl-food"></i>Your orders</a>
           <a href="" class="flex items-center gap-3"><i class="fa-regular fa-heart"></i>Favorites</a>
           <a href="" class="flex items-center gap-3"><i class="fa-regular fa-bookmark"></i>Wishlist</a>
           <a href="" class="flex items-center gap-3"><i class="fa-solid fa-indian-rupee-sign"></i>Balance</a>
           <a href="" class="flex items-center gap-3"><i class="fa-solid fa-wallet"></i>Choose Payment</a>
           <a href="" class="flex items-center gap-3"><i class="fa-solid fa-gear"></i>Settings</a> 
        </div>

        <div class="p-6 mt-15">
            <a href="" class="flex items-center gap-3"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
        </div>
    </nav>

    <!-- Upper bar -->
     <div id="upperbar" class="bg-amber-300 w-full p-3 flex items-center justify-between">
        <div id="search-bar" class="flex items-center w-1/3 h-9 ml-70 bg-white rounded-3xl">
            <input type="text" placeholder="Search" class="w-full h-full rounded-3xl p-3 outline-0 border-0">
            <div id="search-icon" class="flex items-center justify-center text-amber-900 h-full w-12 p-1"><i class="fa-solid fa-magnifying-glass"></i></div>
        </div>
        <div>
            <div id="address-bar" class="flex items-center w-100 h-9 bg-white rounded-3xl">
            <input type="text" placeholder="Add you address" class="w-full h-full rounded-3xl p-3 outline-0 border-0">
            <div id="add-address" class="flex items-center justify-center text-amber-900 h-full w-12 p-1"><i class="fa-solid fa-plus"></i></i></div>
        </div>
        </div>
        <div id="right-icons" class="flex gap-6 mr-3 text-2xl">
            <a href="" class=""><i class="fa-solid fa-cart-shopping"></i></a>
            <a href=""><i class="fa-solid fa-circle-user"></i></a>
        </div>

        <div id="left-bar" class="absolute bg-green-800 top-0 right-0 h-screen w-60 mt-15 grid-cols-1">

            <div id="food-menu" class="mt-3 flex justify-center gap-3">
            <i class="fa-solid fa-bell-concierge text-2xl"></i>
            <h1 class="text-white font-bold">Menu</h1>
            </div>

            <div id="food-sections" class="flex justify-center">
                <div id="first" class="w-20 h-20">
                    <div>
                        <i class="fa-solid fa-pizza-slice"></i>
                        <p>Pizza</p>
                    </div>
                </div>
            </div>
            
        </div>


     </div> 

    <script src="app.js"></script>
</body>
</html>
