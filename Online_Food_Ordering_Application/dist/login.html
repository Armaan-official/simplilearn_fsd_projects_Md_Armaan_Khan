<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="output.css">
    <title>Login Page</title>
</head>
<body class="bg-[#f9dbbd] flex justify-center items-center h-screen w-[98.8vw]">
   
    <!----------------------------------- Login container ------------------------------------>
    <div id="container" class="relative h-[95vh] flex-col w-1/2 ml-6">

        <!------------------------- Heading of the login page---------------------------------->
        <div class="absolute top-10 left-20">
             <div class="max-md:w-58 max-sm:w-30 flex justify-center items-center flex-col max-sm:text-[22px] max-md:text-[28px] text-[clamp(1rem,4vw,40px)] font-bold text-shadow-[0px_0px_6px_rgba(0,0,0,0.6)]">
            <h1 class=" ">Welcome To The <span class="text-amber-400 underline underline-offset-4 hover:text-amber-300">QuickBite</span> App</h1>
            <h1 class="text-amber-800 hover:text-amber-600">Login Page</h1>
            </div>
        </div>
       
        

    <!----------------------------------- Login inputs ------------------------------------>
        <form id="login-form" action="" 
        method="get" class="
        rounded-tl-4xl rounded-bl-4xl w-full max-w-190 h-full 
        flex justify-center items-center 
        flex-col gap-y-10 shadow-[0px_0px_10px_rgba(0,0,0,0.6)] bg-[radial-gradient(circle,rgba(238,174,202,1)_0%,rgba(148,187,233,1)_100%)]">

            <div id="name">
                <label for="username" class="max-sm:hidden"><i class="fa-solid 
                    fa-user text-2xl"></i></label>
                <input type="text" 
                id="username" 
                name="username" 
                placeholder="Username" 
                required class="ml-3 p-3 w-70 max-sm:w-50 max-md:w-60
                rounded-xl outline-0 
                placeholder:font-bold 
                hover:bg-white 
                shadow-[0px_0px_10px_rgba(0,0,0,0.8)] 
                hover:placeholder-black">
            </div>

            <div id="pass" class="group">
                <label for="password" class="max-sm:hidden"><i class="fa-solid 
                    fa-key text-2xl"></i></i></label>
                <input type="password" 
                id="password" 
                name="password" 
                placeholder="Password" 
                required class="relative ml-3 p-3 w-70 max-sm:w-50 max-md:w-60
                rounded-xl outline-0 
                placeholder:font-bold 
                group-hover:bg-white 
                shadow-[0px_0px_10px_rgba(0,0,0,0.8)] 
                group-hover:placeholder-black">
                <div id="eye" class="absolute left-122 bottom-79.5 max-xl:hidden max-sm:hidden"></div>
            </div>
            
            <div class="flex">
                <button id="submit-btn" 
                type="submit" 
                class="ml-12 rounded-xl p-3 w-52 max-md:w-40 max-sm:w-30
                bg-green-600 font-bold max-sm:mr-10
                shadow-[0px_0px_10px_rgba(0,0,0,0.8)] 
                hover:bg-green-400 hover:text-white"
                onclick="commonButtonSound()">Login</button>
            </div>
            
        </form>
    </div>

    <div id="bg-img" class="w-1/2 mr-2 h-[95vh] shadow-[0px_0px_10px_rgba(0,0,0,0.8)] rounded-br-4xl rounded-tr-4xl overflow-hidden">
        <img class="w-full h-full object-cover" 
        src="https://img.magnific.com/premium-photo/organic-food-background-illustration_626596-390.jpg?w=1060" alt="">
    </div>

    <script src="login.js"></script>
</body>
</html>
